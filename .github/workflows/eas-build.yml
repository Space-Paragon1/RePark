name: EAS Build

on:
  push:
    branches:
      - main
  # iPhone builds are started by hand from the Actions tab, because each one
  # uses EAS build credit and needs Apple signing set up first.
  workflow_dispatch:
    inputs:
      platform:
        description: Which app to build
        type: choice
        options:
          - ios
          - android
        default: ios

jobs:
  android:
    name: Build Android APK
    if: github.event_name == 'push' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Build Android (preview)
        working-directory: mobile
        run: npx eas-cli@latest build --profile preview --platform android --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ios:
    name: Build iPhone app and send to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      # The build runs on EAS's Macs, so this job doesn't need a macOS runner.
      - name: Build iOS (production) and submit to TestFlight
        working-directory: mobile
        run: npx eas-cli@latest build --profile production --platform ios --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
